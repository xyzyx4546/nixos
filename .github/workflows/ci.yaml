name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake-check:
    name: Flake Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v21
      - name: Nix Flake Check
        run: nix flake check --keep-going
